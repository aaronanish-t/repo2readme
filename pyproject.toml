[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo2readme"
version = "0.1.0"
description = "Generate a grounded README (with a Mermaid architecture diagram) for any GitHub repository."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic>=1.5,<2",
  "pydantic>=2.7",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.19,<2",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
repo2readme = "repo2readme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2readme"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

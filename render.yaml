# Render Blueprint: New > Blueprint > connect this repo.
# Works without an API key (facts-only READMEs). Add ANTHROPIC_API_KEY under Environment to enable the model.
services:
  - type: web
    name: repo2readme
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REPO2README_TRUST_PROXY
        value: "1"
      - key: REPO2README_MAX_CONCURRENT_JOBS
        value: "1"
      - key: REPO2README_RATE_LIMIT_PER_HOUR
        value: "5"
